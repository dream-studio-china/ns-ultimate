name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  store-console-checks:
    name: Store console mobile UI checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/store-console
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/store-console/package-lock.json
      - name: Install store console dependencies
        run: npm ci
      - name: Run store console unit checks and build
        run: npm test && npm run build
      - name: Install mobile test browser
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser flows
        run: npm run test:e2e

  cashier-checks:
    name: Cashier UI checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cashier
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cashier/package-lock.json
      - name: Install cashier dependencies
        run: npm ci
      - name: Run cashier unit tests and build
        run: npm test && npm run build
      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium
      - name: Run cashier browser flows
        run: npm run test:e2e

  project-checks:
    name: Project composition checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/crud-admin/package-lock.json

      - name: Check project documentation links
        run: node scripts/check-doc-links.mjs

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install admin dependencies
        run: npm ci --prefix core/crud-admin

      - name: Install backend dependencies
        run: composer install --working-dir=core/crud-skeleton --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Install integration backend dependencies
        run: composer install --working-dir=integration/backend --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Run project workflow, assistant, and admin composition tests
        run: node --test scripts/*.test.mjs apps/admin-agent/tests/*.test.mjs integration/admin/*.test.mjs

      - name: Run backend composition and business integration tests
        run: php core/crud-skeleton/vendor/bin/phpunit -c integration/backend/phpunit.xml

      - name: Run PHPStan across core and business backend code
        run: make phpstan

      - name: Build composed admin without upstream test scripts
        working-directory: core/crud-admin
        run: ./node_modules/.bin/vite build --config ../../integration/admin/vite.config.ts
