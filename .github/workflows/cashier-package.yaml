name: Cashier desktop package

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop target
        required: true
        default: windows
        type: choice
        options:
          - windows
          - macos

permissions:
  contents: read

jobs:
  package:
    name: Build unsigned cashier installer
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    defaults:
      run:
        working-directory: apps/cashier
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cashier/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit checks
        run: npm test
      - name: Build Windows installer
        if: inputs.platform == 'windows'
        run: npm run dist:win
      - name: Build macOS installer
        if: inputs.platform == 'macos'
        run: npm run dist:mac
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ns-cashier-${{ inputs.platform }}-unsigned
          path: |
            apps/cashier/release/*.exe
            apps/cashier/release/*.dmg
          if-no-files-found: error
