services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Public so integration tests can resolve them directly.
    NsUltimate\Business\Wechat\Service\SecretCipher:
        public: true
        arguments:
            $encodedKey: '%env(WECHAT_CREDENTIAL_KEY)%'

    NsUltimate\Business\Wechat\Service\StoreWechatResolver:
        public: true

    NsUltimate\Business\Wechat\Service\WechatClientFactory:
        public: true

    NsUltimate\Business\Wechat\Service\WechatApplicationService:
        public: true

    NsUltimate\Business\Wechat\Service\WechatApplicationRevisionService:
        public: true

    NsUltimate\Business\Wechat\Service\WechatMerchantService:
        public: true

    NsUltimate\Business\Wechat\Service\WechatMerchantRevisionService:
        public: true

    NsUltimate\Business\Wechat\Service\StoreWechatSettingService:
        public: true

    NsUltimate\Business\Wechat\Service\WechatIdentityService:
        public: true

    NsUltimate\Business\Wechat\Service\StoreWechatLoginService:
        public: true

    NsUltimate\Business\Wechat\Service\WechatOAuthStateService:
        public: true

    NsUltimate\Business\Wechat\Service\WechatLoginGatewayInterface:
        alias: NsUltimate\Business\Wechat\Service\EasyWeChatLoginGateway

    NsUltimate\Business\Wechat\Service\EasyWeChatLoginGateway:
        public: true

    # Expose the Store-scoped customer login/OAuth endpoints anonymously without
    # modifying the core security subtree.
    NsUltimate\Business\Wechat\Security\StoreWechatAccessMap:
        decorates: security.access_map
        arguments:
            $inner: '@.inner'
