services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Public so integration tests can resolve them directly.
    NsUltimate\Business\Wechat\Service\SecretCipher:
        public: true
        arguments:
            $encodedKey: '%env(WECHAT_CREDENTIAL_KEY)%'

    NsUltimate\Business\Wechat\Service\StoreWechatResolver:
        public: true

    NsUltimate\Business\Wechat\Service\WechatClientFactory:
        public: true

    NsUltimate\Business\Wechat\Service\WechatApplicationService:
        public: true

    NsUltimate\Business\Wechat\Service\WechatApplicationRevisionService:
        public: true

    NsUltimate\Business\Wechat\Service\WechatMerchantService:
        public: true

    NsUltimate\Business\Wechat\Service\WechatMerchantRevisionService:
        public: true

    NsUltimate\Business\Wechat\Service\StoreWechatSettingService:
        public: true

    NsUltimate\Business\Wechat\Service\WechatIdentityService:
        public: true

    NsUltimate\Business\Wechat\Service\StoreWechatLoginService:
        public: true

    NsUltimate\Business\Wechat\Service\WechatOAuthStateService:
        public: true

    NsUltimate\Business\Wechat\Service\WechatProfileGrantService:
        public: true

    NsUltimate\Business\Wechat\Service\WechatCredentialProbe:
        public: true

    NsUltimate\Business\Wechat\Service\WechatAuditLogger:
        public: true

    NsUltimate\Business\Wechat\Service\InvoiceStoreContextAdapter:
        public: true

    NsUltimate\Business\Wechat\Service\WechatPaymentAttemptService:
        public: true

    NsUltimate\Business\Wechat\Service\EasyWeChatPayProvider:
        public: true

    NsUltimate\Business\Wechat\Service\WechatPayProviderInterface:
        alias: NsUltimate\Business\Wechat\Service\EasyWeChatPayProvider

    NsUltimate\Business\Wechat\Service\WechatPaymentGateway:
        public: true
        arguments:
            $legacyGateway: '@App\Wechat\Service\Payment\WechatPayGateway'
            $notifyUrl: '%env(WECHAT_STORE_PAY_NOTIFY_URL)%'
        tags: ['payment.gateway']

    NsUltimate\Business\Wechat\Service\WechatPaymentCompletionService:
        public: true
        arguments:
            $invoiceServices: !service_locator
                invoice: '@App\Payment\Service\InvoiceServiceInterface'

    NsUltimate\Business\Wechat\Service\WechatRefundOrchestrator:
        public: true
        arguments:
            $invoiceWorkflow: '@state_machine.invoice'
            $refundNotifyUrl: '%env(WECHAT_STORE_REFUND_NOTIFY_URL)%'

    NsUltimate\Business\Wechat\Service\WechatRefundAttemptService:
        public: true

    NsUltimate\Business\Wechat\Service\WechatLoginGatewayInterface:
        alias: NsUltimate\Business\Wechat\Service\EasyWeChatLoginGateway

    NsUltimate\Business\Wechat\Service\EasyWeChatLoginGateway:
        public: true

    # Expose the Store-scoped customer login/OAuth endpoints anonymously without
    # modifying the core security subtree.
    NsUltimate\Business\Wechat\Security\StoreWechatAccessMap:
        decorates: security.access_map
        arguments:
            $inner: '@.inner'
