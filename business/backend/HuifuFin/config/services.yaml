services:
    NsUltimate\Business\HuifuFin\Service\Configuration\HuifuSecretCipher:
        arguments:
            $key: '%env(HUIFU_CONFIG_KEY)%'

    NsUltimate\Business\HuifuFin\Service\Configuration\HuifuOperationProof:
        arguments:
            $key: '%env(HUIFU_CONFIG_KEY)%'

    NsUltimate\Business\HuifuFin\Client\HuifuClient:
        autowire: true
        arguments:
            $baseUrl: '%env(HUIFU_API_BASE_URL)%'
            $sandboxBaseUrl: '%env(HUIFU_SANDBOX_API_BASE_URL)%'

    NsUltimate\Business\HuifuFin\Client\HuifuClientInterface: '@NsUltimate\Business\HuifuFin\Client\HuifuClient'

    NsUltimate\Business\HuifuFin\Service\Payment\HuifuRequestFactory:
        autowire: true
        arguments:
            # Public backend origin used for Huifu notify_url values. It must be
            # reachable by Huifu and is not derived from the incoming request.
            $notifyBaseUrl: '%env(DEFAULT_URI)%'

    NsUltimate\Business\HuifuFin\Service\Payment\HuifuPaymentGateway:
        autowire: true
        autoconfigure: false
        tags:
            - { name: payment.gateway, priority: -110 }
