name: ns-ultimate-dev

services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ns_ultimate
      MYSQL_USER: ns_ultimate
      MYSQL_PASSWORD: ns_ultimate_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports:
      - "127.0.0.1:${DEV_MYSQL_PORT:-3307}:3306"
    volumes:
      - dev_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  php:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: php-dev
    working_dir: /srv/app
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment:
      DEV_UID: "${DEV_UID:-1000}"
      APP_ENV: dev
      APP_DEBUG: "1"
      COMPOSER_HOME: /tmp/composer
      APP_SECRET: ns-ultimate-docker-dev-secret
      REFRESH_TOKEN_SECRET: ns-ultimate-docker-dev-refresh-secret
      DATABASE_URL: "mysql://ns_ultimate:ns_ultimate_dev@database:3306/ns_ultimate?serverVersion=8.4&charset=utf8mb4"
      DEFAULT_URI: http://127.0.0.1:8000
      APP_SHARE_DIR: /srv/app/var/docker-dev/data
      JWT_PRIVATE_KEY_PATH: /srv/app/var/docker-dev/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /srv/app/var/docker-dev/keys/public.pem
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      OUTBOX_PUBLISH_INTERVAL: "5"
      MAILER_DSN: null://null
      MEDIA_STORAGE_DEFAULT: local
      INVENTORY_ENABLED: "0"
      OTP_REDIS_DSN: redis://127.0.0.1:6379
      ALIYUN_SMS_DRY_RUN: "1"
      NS_DEV_DB_HOST: database
      NS_DEV_DB_PORT: "3306"
      NS_DEV_DB_USER: ns_ultimate
      NS_DEV_DB_PASSWORD: ns_ultimate_dev
      NS_DEV_DB_NAME: ns_ultimate
      NS_DEV_DATA_DIR: /srv/app/var/docker-dev/data
      NS_DEV_KEYS_DIR: /srv/app/var/docker-dev/keys
      NS_INITIAL_PASSWORD_FILE: /srv/app/var/docker-dev/keys/admin-initial-password.txt
      NS_ADMIN_EMAIL_FILE: /srv/app/var/docker-dev/keys/admin-email.txt
      NS_SKIP_DATABASE_URL_WRITE: "1"
      NS_SKIP_BACKEND_SECRET_FILE: "1"
      NS_SKIP_DB_OWNERSHIP_MARKER: "1"
    volumes:
      - ../..:/srv/app
      - dev_composer_vendor:/srv/app/core/crud-skeleton/vendor
    ports:
      - "${HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    command: >-
      sh -lc 'composer install --working-dir=core/crud-skeleton --no-scripts --no-interaction --no-progress
      && php -S 0.0.0.0:8000 -t integration/backend/public integration/backend/public/index.php'
    depends_on:
      database:
        condition: service_healthy

volumes:
  dev_mysql_data:
    name: ns-ultimate-dev_dev_mysql_data
  dev_composer_vendor:
