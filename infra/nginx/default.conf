server {
    listen 80;
    server_name _;
    root /srv/app/integration/backend/public;
    index index.html index.php;

    client_max_body_size 12m;

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        root /srv/app/dist;
        try_files $uri $uri/ /admin/index.html;
    }

    location /uploads/ {
        alias /srv/app/core/crud-skeleton/public/uploads/;
        try_files $uri =404;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/app/integration/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /srv/app/integration/backend/public;
        fastcgi_pass app:9000;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }
}
