services:
    _defaults:
        autowire: true
        autoconfigure: true

    NsUltimate\Apps\AdminAgent\Backend\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Adapter/'

    # Explicit host selection; adapters are never enabled by discovery.
    NsUltimate\Apps\AdminAgent\Backend\Adapter\NsUltimate\CounterMutationAdapter: ~
    NsUltimate\Apps\AdminAgent\Backend\Adapter\NsUltimate\StoreMutationAdapter: ~
    NsUltimate\Apps\AdminAgent\Backend\Adapter\NsUltimate\CategoryMutationAdapter: ~
    NsUltimate\Apps\AdminAgent\Backend\Adapter\NsUltimate\TagMutationAdapter: ~
    NsUltimate\Apps\AdminAgent\Backend\Adapter\NsUltimate\ProductCategoryMutationAdapter: ~
    NsUltimate\Apps\AdminAgent\Backend\Adapter\NsUltimate\ProductMutationAdapter: ~
    NsUltimate\Apps\AdminAgent\Backend\Adapter\NsUltimate\SpecificationMutationAdapter: ~
    NsUltimate\Apps\AdminAgent\Backend\Adapter\NsUltimate\StorePrintingMutationAdapter: ~
    NsUltimate\Apps\AdminAgent\Backend\Adapter\NsUltimate\ProductPrintingMutationAdapter: ~

    # The audited bridge is the only adapter-facing write executor for Tag and Counter.
    # It stays public so opt-in PHP exporters/harnesses can inject the real composed one.
    NsUltimate\Apps\AdminAgent\Backend\Contract\AdminCrudExecutor: '@NsUltimate\Apps\AdminAgent\Backend\Service\AdminCrudControllerBridge'
    NsUltimate\Apps\AdminAgent\Backend\Service\AdminCrudControllerBridge:
        public: true

    # Explicit create-only batch selection; single-record adapters above remain the source of
    # field validation, authorization and uniqueness behavior.
    NsUltimate\Apps\AdminAgent\Backend\Adapter\NsUltimate\TagBatchCreateAdapter: ~
    NsUltimate\Apps\AdminAgent\Backend\Adapter\NsUltimate\CounterBatchCreateAdapter: ~

    # Pilot business schemas are optional during composition so this package can boot without the
    # business modules; when installed, the owning services supply the Tag/Counter field rules.
    NsUltimate\Apps\AdminAgent\Backend\Capability\CapabilityCatalog:
        arguments:
            $tagWriteService: '@?NsUltimate\Business\Common\Service\TagWriteService'
            $counterWriteService: '@?NsUltimate\Business\Counter\Service\CounterWriteService'
