# Rate limiting for public-facing endpoints (brute-force protection).
# Limiters are keyed by client IP by default (see RateLimitListener).
# The default cache pool (filesystem) is used; for multi-worker deployments
# configure a shared cache adapter (e.g. Redis) so limits are global.
framework:
    rate_limiter:
        # Login with identifier + password
        auth_login:
            policy: 'sliding_window'
            limit: 10
            interval: '1 minute'

        # Public self-registration
        auth_register:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'

        # OTP send (SMS cost guard)
        otp_request:
            policy: 'sliding_window'
            limit: 5
            interval: '1 minute'

        # OTP verification (PIN brute-force guard)
        otp_verify:
            policy: 'sliding_window'
            limit: 10
            interval: '1 minute'

        # WeChat login endpoints (js_code / oauth callback)
        wechat_login:
            policy: 'sliding_window'
            limit: 20
            interval: '1 minute'

        # Payment initiation (invoice pay / order payment)
        payment:
            policy: 'sliding_window'
            limit: 30
            interval: '1 minute'

when@test:
    framework:
        rate_limiter:
            # Keep the suite green: production limits are disabled in tests.
            # The 429 behaviour is covered by RateLimitListenerTest which builds
            # its own low-limit factory instead of relying on global limits.
            auth_login:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            auth_register:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            otp_request:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            otp_verify:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            wechat_login:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
            payment:
                policy: 'sliding_window'
                limit: 100000
                interval: '1 minute'
