services:
  # ========================
  # Application (PHP-FPM)
  # ========================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Symfony core (required)
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:-dev-secret-change-me}
      DATABASE_URL: "mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=8.0&charset=utf8mb4"

      # JWT authentication (required)
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/var/www/html/var/jwt/jwt_private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/var/www/html/var/jwt/jwt_public.pem}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-7200}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-31536000}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev-refresh-secret-change-me}

      # OTP / SMS (optional — leave empty to disable)
      OTP_REDIS_DSN: ${OTP_REDIS_DSN:-redis://redis:6379/0}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_REGION: ${ALIYUN_SMS_REGION:-cn-hangzhou}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_LOGIN_OTP: ${ALIYUN_SMS_TEMPLATE_LOGIN_OTP:-}
      ALIYUN_SMS_TEMPLATE_VERIFY_PHONE: ${ALIYUN_SMS_TEMPLATE_VERIFY_PHONE:-}
      ALIYUN_SMS_DRY_RUN: ${ALIYUN_SMS_DRY_RUN:-true}

      # WeChat Mini Program (optional)
      WECHAT_MINIAPP_APP_ID: ${WECHAT_MINIAPP_APP_ID:-}
      WECHAT_MINIAPP_SECRET: ${WECHAT_MINIAPP_SECRET:-}

      # WeChat Official Account (optional)
      WECHAT_OFFICIAL_APP_ID: ${WECHAT_OFFICIAL_APP_ID:-}
      WECHAT_OFFICIAL_SECRET: ${WECHAT_OFFICIAL_SECRET:-}
      WECHAT_OFFICIAL_TOKEN: ${WECHAT_OFFICIAL_TOKEN:-}
      WECHAT_OFFICIAL_AES_KEY: ${WECHAT_OFFICIAL_AES_KEY:-}

      # WeChat Pay V3 (optional)
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_SECRET_KEY: ${WECHAT_PAY_SECRET_KEY:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      WECHAT_PAY_CERTIFICATE: ${WECHAT_PAY_CERTIFICATE:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}

      # Infrastructure (defaults work out of the box)
      MAILER_DSN: ${MAILER_DSN:-smtp://mailer:1025}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost}
      INVENTORY_ENABLED: ${INVENTORY_ENABLED:-0}

    volumes:
      - ./var:/var/www/html/var
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal

  # ========================
  # Async Worker (Messenger)
  # ========================
  worker:
    extends:
      service: app
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "--no-interaction"]
    depends_on:
      app:
        condition: service_started

  # ========================
  # Outbox Scheduler
  # ========================
  scheduler:
    extends:
      service: app
    command:
      - /bin/sh
      - -ec
      - |
        while :; do
          php bin/console app:trade:outbox:publish --no-interaction
          php bin/console app:store:outbox:publish --no-interaction
          php bin/console app:inventory:outbox:publish --no-interaction
          php bin/console app:inventory:reservations:release-expired --no-interaction
          php bin/console app:settlement:allocations:requeue-due --no-interaction
          php bin/console app:settlement:outbox:publish --no-interaction
          sleep "${OUTBOX_PUBLISH_INTERVAL:-5}"
        done
    depends_on:
      app:
        condition: service_started

  # ========================
  # Web Server (nginx)
  # ========================
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal
    # Full-path readiness: nginx -> PHP-FPM -> Symfony -> DB/Redis (via
    # /health/ready). The app is not marked healthy until dependencies respond.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========================
  # Database (MySQL 8)
  # ========================
  database:
    image: mysql:${MYSQL_VERSION:-8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-!RootChangeMe!}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mysql_data:/var/lib/mysql:rw
    networks:
      - internal

  # ========================
  # Cache (Redis)
  # ========================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal

  # ========================
  # Email Testing (Mailpit)
  # ========================
  mailer:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - internal

networks:
  internal:

volumes:
  mysql_data:
  redis_data:
