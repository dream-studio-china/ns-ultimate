name: Migrations

on:
  push:
    branches: [main, master]
    paths:
      - 'migrations/**'
      - 'config/**'
      - 'bin/**'
      - 'composer.json'
      - 'composer.lock'
      - 'symfony.lock'
      - '.github/workflows/migrations.yml'
  pull_request:
    branches: [main, master, dev]
    paths:
      - 'migrations/**'
      - 'config/**'
      - 'bin/**'
      - 'composer.json'
      - 'composer.lock'
      - 'symfony.lock'
      - '.github/workflows/migrations.yml'

jobs:
  mysql-migration-chain:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: crud_skeleton_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uapp -papp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
      - run: composer install --no-interaction --prefer-dist
        env:
          DATABASE_URL: mysql://app:app@127.0.0.1:3306/crud_skeleton_test?serverVersion=8.4&charset=utf8mb4
      - run: php bin/console doctrine:migrations:migrate --no-interaction --env=dev
        env:
          DATABASE_URL: mysql://app:app@127.0.0.1:3306/crud_skeleton_test?serverVersion=8.4&charset=utf8mb4
      - run: php bin/console doctrine:migrations:status --env=dev
        env:
          DATABASE_URL: mysql://app:app@127.0.0.1:3306/crud_skeleton_test?serverVersion=8.4&charset=utf8mb4
